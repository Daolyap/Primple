name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore TerrainMapGenerator.sln
    
    - name: Build
      run: dotnet build TerrainMapGenerator.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test TerrainMapGenerator.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

  release-cli:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    
    strategy:
      matrix:
        include:
          - runtime: win-x64
            artifact: terrain-map-generator-cli-windows-x64
          - runtime: linux-x64
            artifact: terrain-map-generator-cli-linux-x64
          - runtime: osx-x64
            artifact: terrain-map-generator-cli-macos-x64
          - runtime: osx-arm64
            artifact: terrain-map-generator-cli-macos-arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Publish CLI ${{ matrix.runtime }}
      run: |
        dotnet publish src/TerrainMapGenerator.Cli/TerrainMapGenerator.Cli.csproj \
          --configuration Release \
          --runtime ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          --output ./publish/${{ matrix.runtime }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ./publish/${{ matrix.runtime }}

  release-desktop:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact: terrain-map-generator-desktop-windows-x64
          - os: ubuntu-latest
            runtime: linux-x64
            artifact: terrain-map-generator-desktop-linux-x64
          - os: macos-latest
            runtime: osx-x64
            artifact: terrain-map-generator-desktop-macos-x64
          - os: macos-latest
            runtime: osx-arm64
            artifact: terrain-map-generator-desktop-macos-arm64
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Publish Desktop ${{ matrix.runtime }}
      run: |
        dotnet publish src/TerrainMapGenerator.Desktop/TerrainMapGenerator.Desktop.csproj \
          --configuration Release \
          --runtime ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          --output ./publish/${{ matrix.runtime }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ./publish/${{ matrix.runtime }}
